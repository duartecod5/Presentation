<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Presentaciones Interactivas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #F0F4F8; /* Light Grayish Blue */
            color: #2C3E50; /* Dark Blue-Gray */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }
        h1 {
            font-family: 'Montserrat', sans-serif;
        }
        .container {
            background-color: #FFFFFF;
            padding: 2.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            margin: 0.75rem;
            border-radius: 0.5rem;
            font-weight: 700;
            text-decoration: none;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-primary {
            background-color: #008080; /* Muted Teal */
            color: #FFFFFF;
        }
        .btn-primary:hover {
            background-color: #006666; /* Darker Teal */
            transform: translateY(-2px);
        }
        .btn-secondary {
            background-color: #2C3E50; /* Dark Blue-Gray */
            color: #FFFFFF;
        }
        .btn-secondary:hover {
            background-color: #1A2B3C; /* Even Darker Blue-Gray */
            transform: translateY(-2px);
        }
        @media (max-width: 640px) {
            .btn {
                display: block;
                width: calc(100% - 1.5rem); /* Adjust for margin */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-4xl font-extrabold mb-6 text-[#2C3E50]">Bienvenido a Mis Presentaciones</h1>
        <p class="text-lg text-gray-700 mb-8">Selecciona la presentación que deseas explorar:</p>
        <div class="flex flex-col sm:flex-row justify-center items-center">
            <!-- Enlace a la presentación de Nicaragua -->
            <a href="nicaragua.html" class="btn btn-primary">
                Ver Presentación de Nicaragua
            </a>
            <!-- Enlace a la presentación de Siria -->
            <a href="siria.html" class="btn btn-secondary">
                Ver Presentación de Siria
            </a>
        </div>
        <p class="text-sm text-gray-500 mt-8">
        </p>
    </div>
</body>
</html>
